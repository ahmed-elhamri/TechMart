stages:
  - test
  - xray

playwright-tests:
  stage: test
  tags:
    - windows
    - playwright
  script:
    - npm ci
    - npx playwright install chromium
    - npx playwright test tests/TS-SMOKE.spec.js
    - powershell -ExecutionPolicy Bypass -File scripts/prepare-xray-results.ps1
  artifacts:
  when: always
  paths:
    - playwright-report/
    - junit-results.xml
    - xray-junit-results.xml
  reports:
    junit: junit-results.xml
  expire_in: 30 days

xray-auth-check:
  stage: xray
  tags:
    - windows
    - playwright
  script:
    - |
      if (-not $env:XRAY_CLIENT_ID -or -not $env:XRAY_CLIENT_SECRET) {
          throw "Les variables Xray sont manquantes."
      }

      $body = @{
          client_id = $env:XRAY_CLIENT_ID
          client_secret = $env:XRAY_CLIENT_SECRET
      } | ConvertTo-Json

      try {
          $token = Invoke-RestMethod `
              -Uri "https://xray.cloud.getxray.app/api/v2/authenticate" `
              -Method POST `
              -ContentType "application/json" `
              -Body $body

          if (-not $token) {
              throw "Token Xray vide."
          }

          Write-Host "Authentification Xray réussie."
      }
      catch {
          Write-Host "Échec de l'authentification Xray."
          throw
      }