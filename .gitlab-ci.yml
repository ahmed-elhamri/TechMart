stages:
  - test
  - xray
  - deploy

playwright-tests:
  stage: test
  tags:
    - windows
    - playwright
  script:
  - npm ci
  - npx playwright install chromium
  - |
      Remove-Item "junit-results.xml" -ErrorAction SilentlyContinue
      ...
      exit $testExitCode
  artifacts:
    when: always
    paths:
      - playwright-report/
      - junit-results.xml
      - xray-junit-results.xml
    reports:
      junit: junit-results.xml
    expire_in: 30 days

xray-import:
  stage: xray
  tags:
    - windows
    - playwright
  when: always
  dependencies:
    - playwright-tests
  script:
    - powershell -ExecutionPolicy Bypass -File scripts/import-xray-results.ps1

pages:
  stage: deploy
  tags:
    - windows
    - playwright
  when: always
  dependencies:
    - playwright-tests
  script:
    - |
      if (-not (Test-Path "playwright-report/index.html")) {
      ...
      Write-Host "Rapport Playwright prêt pour publication."
  pages:
    publish: public
  artifacts:
    paths:
      - public/