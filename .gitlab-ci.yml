stages:
  - test
  - xray

playwright-tests:
  stage: test
  tags:
    - windows
    - playwright
  script:
    - npm ci
    - npx playwright install chromium
    - npx playwright test tests/TS-SMOKE.spec.js
    - powershell -ExecutionPolicy Bypass -File scripts/prepare-xray-results.ps1
  artifacts:
    when: always
    paths:
      - playwright-report/
      - junit-results.xml
      - xray-junit-results.xml
    reports:
      junit: junit-results.xml
    expire_in: 30 days

xray-import:
  stage: xray
  tags:
    - windows
    - playwright
  when: always
  dependencies:
    - playwright-tests
  script:
    - powershell -ExecutionPolicy Bypass -File scripts/import-xray-results.ps1