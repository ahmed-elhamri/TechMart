stages:
  - test

playwright-tests:
  stage: test

  tags:
    - windows
    - playwright

  script:
    - npm ci
    - npx playwright install chromium
    - npx playwright test tests/TS-SMOKE.spec.js

  artifacts:
    when: always
    paths:
      - playwright-report/
      - junit-results.xml
    reports:
      junit: junit-results.xml
    expire_in: 30 days